[package]
name = "wgtc"
version = "0.1.0"
edition = "2024"

[dependencies]
aya = { git = "https://github.com/aya-rs/aya", rev = "746a4e9", default-features = false }
aya-log = { git = "https://github.com/aya-rs/aya", rev = "746a4e9", default-features = false, optional = true }
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.101"
simple_logger = "5.2.0"
log = "0.4.29"
nix = { version = "0.31.3", features = ["time"] }

[features]
ebpf_log = ["aya-log", "nix/poll"]

[build-dependencies]
anyhow = "1.0.101"
aya-build = { git = "https://github.com/aya-rs/aya", rev = "746a4e9", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
