name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release musl binary
    runs-on: ubuntu-latest
    env:
      BIN_NAME: wgtc
      TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add "${TARGET}"
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install bpf-linker --locked

      - name: Build release binary
        run: cargo build --locked --release --target "${TARGET}" --package "${BIN_NAME}"

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${BIN_NAME}-${TARGET}"
          chmod +x "dist/${BIN_NAME}-${TARGET}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" "dist/${BIN_NAME}-${TARGET}" \
            --title "${TAG_NAME}" \
            --generate-notes
